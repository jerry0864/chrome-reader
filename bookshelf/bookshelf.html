<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的书库 — Epub Reader</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="bookshelf.css">
</head>
<body>
  <div id="drop-overlay" class="drop-overlay hidden">
    <div class="drop-message">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 5v14M5 12l7-7 7 7"/>
      </svg>
      <p>松开以添加书籍</p>
    </div>
  </div>


<header>
    <h1>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      我的书库
    </h1>
    <div class="header-actions">
      <label class="pinyin-toggle" title="标签页与书名显示为拼音">
        <input type="checkbox" id="toggle-pinyin">
        <span class="pinyin-toggle-track"></span>
        <span class="pinyin-toggle-label">拼音标题</span>
      </label>
      <button id="btn-add" class="btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        添加书籍
      </button>
    </div>
  </header>

  <main>
    <div id="empty-state" class="empty-state hidden">
      <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <p>书库是空的</p>
      <p class="hint">点击「添加书籍」或拖拽 epub 文件到此处</p>
    </div>
    <div id="book-grid" class="book-grid"></div>
  </main>

  <input type="file" id="file-input" accept=".epub,.mobi,.azw,.azw3" multiple style="display:none">
  <script src="../lib/jszip.min.js"></script>
  <script src="../lib/epub.min.js"></script>
  <script src="../lib/fflate.umd.js"></script>
  <script src="../lib/pinyin-pro.js"></script>
  <script type="module" src="bookshelf.js"></script>
</body>
</html>
